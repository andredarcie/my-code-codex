title: My Code Codex
description: As boas práticas de engenharia backend .NET que André N. Darcie usa no dia a dia.
lang: pt-BR
author: André N. Darcie
repository: andredarcie/my-code-codex
url: https://andredarcie.github.io
baseurl: /my-code-codex

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-default-layout

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

# O README da raiz é a capa do repositório no GitHub; no site a capa é o index.html.
exclude:
  - README.md
  - LICENSE

# A seção de cada pasta (a trilha no topo da página).
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "Arquitetura" }
    values: { secao: Arquitetura }
  - scope: { path: "backend" }
    values: { secao: Backend }
  - scope: { path: "Infra" }
    values: { secao: Integrações }
  - scope: { path: "Acesso a API Externa.md" }
    values: { secao: Integrações, title: Acesso a API externa }
  - scope: { path: "Persistence Patterns" }
    values: { secao: Persistência }
  - scope: { path: "design-patterns" }
    values: { secao: Design patterns }
  - scope: { path: "testes" }
    values: { secao: Testes }
  - scope: { path: "seguranca" }
    values: { secao: Segurança }
  - scope: { path: "performance" }
    values: { secao: Performance }
  - scope: { path: "observabilidade" }
    values: { secao: Observabilidade }
  - scope: { path: "mensageria" }
    values: { secao: Mensageria }
  - scope: { path: "cloud" }
    values: { secao: Cloud }
  - scope: { path: "dev-ops" }
    values: { secao: DevOps }
  - scope: { path: "soft-skills" }
    values: { secao: Soft skills }
  - scope: { path: "carreira" }
    values: { secao: Carreira }
  - scope: { path: "referencias" }
    values: { secao: Referências }
